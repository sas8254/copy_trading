# Production stack: everything needed to copy trade on a server, behind HTTPS.
#
#   caddy          HTTPS (automatic certificates) + serves the website + proxies /api and /ws
#   web            Django API + live updates (Daphne)
#   celery_worker  places / modifies / cancels copy orders
#   celery_beat    runs the copy engine every 2s, lot-size sync, login reminder
#   kite_ticker    optional instant feed from Zerodha (idle unless enabled in Settings)
#   db, redis      private (no ports exposed)
#
# Django admin is not public: Caddy returns 404 for /admin. It is reachable
# only from the server itself on 127.0.0.1:8000, e.g. through an SSH tunnel:
#   ssh -L 8000:127.0.0.1:8000 you@server   then open http://localhost:8000/admin/
#
# Start with ./start.sh (see ../README.md, "Deploying to a server").

name: core-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  build:
    context: ../backend
  image: copytrading-backend
  restart: unless-stopped
  env_file: .env
  environment:
    NUM_PROXIES: "1"  # Caddy
  depends_on:
    migrate:
      condition: service_completed_successfully
  logging: *logging

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One-shot: apply database migrations before anything else starts.
  migrate:
    <<: *backend
    restart: "no"
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *backend
    # Static files (admin CSS/JS) are collected here so whitenoise can serve them.
    command: sh -c "python manage.py collectstatic --noinput -v 0 && daphne -b 0.0.0.0 -p 8000 --proxy-headers core.asgi:application"
    ports:
      - "127.0.0.1:8000:8000"  # server-local only: Django admin over an SSH tunnel

  celery_worker:
    <<: *backend
    command: celery -A core worker -l info --concurrency 4

  celery_beat:
    <<: *backend
    command: celery -A core beat -l info --schedule /tmp/celerybeat-schedule

  kite_ticker:
    <<: *backend
    command: python manage.py kite_ticker

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - caddy_data:/data  # certificates - keep this volume
      - caddy_config:/config
    depends_on:
      - web
    logging: *logging

volumes:
  postgres_data_prod:
  caddy_data:
  caddy_config:
