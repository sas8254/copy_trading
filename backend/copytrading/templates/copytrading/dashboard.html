<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copy Trading — Live Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #0e1116; color: #d6dae0; }
    header { padding: 12px 20px; background: #161b22; border-bottom: 1px solid #2b333d;
             display: flex; align-items: center; gap: 14px; }
    header h1 { font-size: 16px; margin: 0; }
    #conn { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #444; }
    #conn.ok { background: #1f6f43; } #conn.bad { background: #8b2c2c; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
    .card { background: #161b22; border: 1px solid #2b333d; border-radius: 8px; padding: 12px 14px; }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
               color: #8b949e; margin: 0 0 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #232a33; font-size: 13px; }
    th { color: #8b949e; font-weight: 600; }
    .pill { padding: 1px 7px; border-radius: 10px; font-size: 11px; }
    .placed { background: #1f6f43; } .simulated { background: #6f5a1f; }
    .failed, .mismatch, .order_failed { background: #8b2c2c; }
    .skipped, .zero_qty { background: #555; }
    .yes { color: #4ec07a; } .no { color: #e06c6c; }
    #log { height: 320px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12px; }
    #log div { padding: 2px 0; border-bottom: 1px solid #1b2129; }
    .t { color: #6b737d; margin-right: 8px; }
    .full { grid-column: 1 / 3; }
    .empty { color: #6b737d; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>Copy Trading — Live</h1>
    <span id="conn" class="bad">disconnected</span>
    <span style="font-size:12px;color:#6b737d" id="updated"></span>
  </header>

  <main>
    <section class="card">
      <h2>Accounts</h2>
      <table><thead><tr><th>Account</th><th>Role</th><th>Active</th><th>Token</th></tr></thead>
      <tbody id="accounts"></tbody></table>
    </section>

    <section class="card">
      <h2>Open Alerts</h2>
      <table><thead><tr><th>Kind</th><th>Account</th><th>×</th><th>Message</th></tr></thead>
      <tbody id="alerts"></tbody></table>
    </section>

    <section class="card full">
      <h2>Copy Orders</h2>
      <table><thead><tr><th>Symbol</th><th>Qty</th><th>Copy acct</th><th>Status</th><th>Broker ID</th></tr></thead>
      <tbody id="copy_orders"></tbody></table>
    </section>

    <section class="card full">
      <h2>Live Events</h2>
      <div id="log"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

    function renderAccounts(rows) {
      $("accounts").innerHTML = rows.length ? rows.map(a =>
        `<tr><td>${esc(a.label)}</td><td>${esc(a.role)}</td>
         <td class="${a.active?'yes':'no'}">${a.active?'yes':'no'}</td>
         <td class="${a.has_token?'yes':'no'}">${a.has_token?'yes':'no'}</td></tr>`).join("")
        : `<tr><td colspan="4" class="empty">none</td></tr>`;
    }
    function renderAlerts(rows) {
      $("alerts").innerHTML = rows.length ? rows.map(a =>
        `<tr><td><span class="pill ${esc(a.kind)}">${esc(a.kind)}</span></td>
         <td>${esc(a.account)}</td><td>${esc(a.count)}</td><td>${esc(a.message)}</td></tr>`).join("")
        : `<tr><td colspan="4" class="empty">no open alerts</td></tr>`;
    }
    function renderCopyOrders(rows) {
      $("copy_orders").innerHTML = rows.length ? rows.map(c =>
        `<tr><td>${esc(c.symbol)}</td><td>${esc(c.qty)}</td><td>${esc(c.copy)}</td>
         <td><span class="pill ${esc(c.status)}">${esc(c.status)}</span></td>
         <td>${esc(c.broker_order_id)}</td></tr>`).join("")
        : `<tr><td colspan="5" class="empty">none yet</td></tr>`;
    }
    function log(obj) {
      const el = $("log");
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      div.innerHTML = `<span class="t">${time}</span>${esc(JSON.stringify(obj))}`;
      el.prepend(div);
      while (el.children.length > 300) el.removeChild(el.lastChild);
      $("updated").textContent = "last event " + time;
    }

    let ws;
    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/dashboard/`);
      ws.onopen = () => { $("conn").textContent = "connected"; $("conn").className = "ok"; };
      ws.onclose = () => { $("conn").textContent = "disconnected"; $("conn").className = "bad";
                           setTimeout(connect, 2000); };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === "snapshot") {
          renderAccounts(msg.accounts); renderAlerts(msg.alerts); renderCopyOrders(msg.copy_orders);
          return;
        }
        log(msg);
      };
    }
    connect();
  </script>
</body>
</html>
